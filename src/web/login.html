<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vitals · sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b7bff'/%3E%3Cstop offset='1' stop-color='%231e22e6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='24' y='24' width='464' height='464' rx='116' fill='url(%23g)'/%3E%3Cpath d='M96 268 H196 L242 150 L300 386 L338 300 H392' fill='none' stroke='white' stroke-width='34' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='410' cy='300' r='24' fill='white'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:15px/1.5 system-ui, sans-serif; background:#0d0f12; color:#e7e9ee; }
  @media (prefers-color-scheme: light){ body{ background:#f6f7f9; color:#1a1c20; } }
  main { text-align:center; padding:2rem; max-width:23rem; }
  h1 { font-size:1.4rem; letter-spacing:.02em; margin:0 0 .25rem; }
  p  { color:#8b93a1; margin:.25rem 0 1.25rem; }
  button { font:inherit; padding:.7rem 1.1rem; border-radius:.6rem; border:0;
           background:#4f8cff; color:#fff; cursor:pointer; }
  button:hover:not(:disabled) { background:#3f7cf0; }
  button:disabled { opacity:.6; cursor:progress; }
  button:focus-visible { outline:2px solid #9ec1ff; outline-offset:2px; }
  .err { color:#ff8a7a; min-height:1.2em; margin-top:1rem; font-size:.9em; }
  .note { font-size:.82em; color:#8b93a1; margin-top:1.5rem; line-height:1.45; }
  input { font:inherit; font-family:ui-monospace,monospace; width:100%;
          padding:.6rem .7rem; margin-bottom:.7rem; border-radius:.6rem;
          border:1px solid #3a3f48; background:#15181d; color:inherit; }
  @media (prefers-color-scheme: light){ input{ background:#fff; border-color:#ccd2da; } }
  input:focus-visible { outline:2px solid #9ec1ff; outline-offset:1px; }
</style>
</head>
<body>
<main>
  <h1>vitals</h1>
  <p id="sub">…</p>
  <input id="code" type="text" inputmode="latin" autocomplete="off"
         spellcheck="false" placeholder="one-time enrolment code"
         aria-label="One-time enrolment code" hidden>
  <button id="primary" hidden></button>
  <div class="err" id="err" role="alert"></div>
  <div class="note" id="note" hidden>
    No admin is enrolled yet. Enrolment requires the one-time code printed in
    the server log at startup (<code>journalctl -u vitals</code>), so reaching
    this page is not enough to claim the account.
  </div>
</main>
<script>
const b64uToBuf = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); s += '='.repeat((4 - s.length % 4) % 4);
  const bin = atob(s), b = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; };
const bufToB64u = buf => { const b = new Uint8Array(buf); let s=''; for (const x of b) s += String.fromCharCode(x);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const err = document.getElementById('err');
const btn = document.getElementById('primary');

async function jget(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.text()) || ('HTTP ' + r.status));
  return r.json();
}

async function post(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.text()) || ('HTTP ' + r.status));
}

async function register() {
  const code = document.getElementById('code').value.trim();
  if (!code) throw new Error('Enter the one-time code from the server log.');
  const opt = await jget('/auth/register/start', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ token: code }) });
  const pk = opt.publicKey;
  pk.challenge = b64uToBuf(pk.challenge);
  pk.user.id = b64uToBuf(pk.user.id);
  (pk.excludeCredentials || []).forEach(c => c.id = b64uToBuf(c.id));
  const cred = await navigator.credentials.create({ publicKey: pk });
  await post('/auth/register/finish', {
    id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
    response: { attestationObject: bufToB64u(cred.response.attestationObject),
                clientDataJSON: bufToB64u(cred.response.clientDataJSON) } });
  location.reload();
}

async function login() {
  const opt = await jget('/auth/login/start', { method:'POST' });
  const pk = opt.publicKey;
  pk.challenge = b64uToBuf(pk.challenge);
  (pk.allowCredentials || []).forEach(c => c.id = b64uToBuf(c.id));
  const cred = await navigator.credentials.get({ publicKey: pk });
  await post('/auth/login/finish', {
    id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
    response: { authenticatorData: bufToB64u(cred.response.authenticatorData),
                clientDataJSON: bufToB64u(cred.response.clientDataJSON),
                signature: bufToB64u(cred.response.signature),
                userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null } });
  location.reload();
}

// Ceremonies expire server-side after 5 minutes and the endpoint refuses new
// ones past a cap, so guard against double-submits rather than piling up state.
function guard(fn) {
  return async () => {
    err.textContent = '';
    btn.disabled = true;
    try { await fn(); }
    catch (e) { err.textContent = e.name === 'NotAllowedError' ? 'Cancelled or timed out.' : e.message; }
    finally { btn.disabled = false; }
  };
}

(async () => {
  if (!window.PublicKeyCredential) {
    document.getElementById('sub').textContent =
      'This browser does not support passkeys. Use a current browser over HTTPS.';
    return;
  }
  const st = await jget('/auth/status');
  const sub = document.getElementById('sub');
  if (st.registered) {
    sub.textContent = 'Sign in to your dashboard.';
    btn.textContent = 'Sign in with passkey';
    btn.onclick = guard(login);
  } else {
    sub.textContent = 'Set up the admin account.';
    btn.textContent = 'Create account with passkey';
    btn.onclick = guard(register);
    const code = document.getElementById('code');
    code.hidden = false;
    code.focus();
    document.getElementById('note').hidden = false;
  }
  btn.hidden = false;
})().catch(e => err.textContent = e.message);
</script>
</body>
</html>
