<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vitals · sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a7bff'/%3E%3Cstop offset='1' stop-color='%234555d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='24' y='24' width='464' height='464' rx='116' fill='url(%23g)'/%3E%3Cpath d='M96 268 H196 L242 150 L300 386 L338 300 H392' fill='none' stroke='white' stroke-width='34' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='410' cy='300' r='24' fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0d10; --surface-1:#121519; --surface-2:#171b21;
    --line:#232830; --ink:#e8eaed; --ink-2:#a8b0ba; --ink-3:#7d8794;
    --accent:#6a7bff; --crit:#e5484d;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:0;
    background:radial-gradient(680px 340px at 50% -6%, rgba(106,123,255,.10), transparent 70%);}
  main{position:relative;z-index:1;width:340px;max-width:92vw;padding:32px 28px 26px;text-align:center;
    background:var(--surface-1);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .mk{width:46px;height:46px;margin:0 auto 16px;border-radius:12px;display:grid;place-items:center;
    background:var(--surface-2);border:1px solid var(--line);color:var(--accent)}
  h1{font-size:20px;font-weight:600;letter-spacing:.01em;margin:0}
  .ekg{width:150px;height:26px;margin:10px auto 4px;display:block;opacity:.9}
  .ekg .base{stroke:var(--line);stroke-width:2;fill:none}
  .ekg .pulse{stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round;
    stroke-dasharray:22 378;animation:trace 3.2s linear infinite}
  @keyframes trace{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
  p{color:var(--ink-3);margin:6px 0 20px;font-size:13.5px}
  button{font:600 14px var(--font);width:100%;padding:11px 14px;border-radius:10px;border:0;cursor:pointer;
    background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    transition:filter .15s,transform .05s}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button svg{width:17px;height:17px}
  .err{color:var(--crit);min-height:1.2em;margin-top:12px;font-size:12.5px}
  .foot{margin-top:18px;font-size:11px;color:var(--ink-3)}
  .foot a{color:var(--ink-2);text-decoration:none}.foot a:hover{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="mk"><svg width="24" height="24" viewBox="0 0 96 96" fill="none"><path d="M8 52 H32 L42 24 L54 76 L62 56 H73" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="56" r="5.5" fill="currentColor"/></svg></div>
  <h1>vitals</h1>
  <svg class="ekg" viewBox="0 0 240 48" preserveAspectRatio="none" aria-hidden="true">
    <polyline class="base" pathLength="400" points="0,24 84,24 94,24 101,10 113,40 123,24 146,24 240,24"/>
    <polyline class="pulse" pathLength="400" points="0,24 84,24 94,24 101,10 113,40 123,24 146,24 240,24"/>
  </svg>
  <p id="sub">…</p>
  <button id="primary" hidden></button>
  <div class="err" id="err"></div>
  <div class="foot">Self-hosted · <a href="https://github.com/mich312/vm-vitals" target="_blank">vm-vitals</a></div>
</main>
<script>
const b64uToBuf = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); s += '='.repeat((4 - s.length % 4) % 4);
  const bin = atob(s), b = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; };
const bufToB64u = buf => { const b = new Uint8Array(buf); let s=''; for (const x of b) s += String.fromCharCode(x);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const err = document.getElementById('err');

// passkey (fingerprint) icon
const KEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M4 12a8 8 0 0 1 16 0c0 1.5-.13 3-.35 4.5"/><path d="M7.3 17.5c.3-1 .5-2.3.5-3.5a4.2 4.2 0 0 1 8.4 0c0 2-.2 3.6-.5 5"/><path d="M12 14c0 3-.3 5.5-1 8"/></svg>';

async function jget(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }

async function register() {
  err.textContent = '';
  const opt = await jget('/auth/register/start', { method:'POST' });
  const pk = opt.publicKey;
  pk.challenge = b64uToBuf(pk.challenge);
  pk.user.id = b64uToBuf(pk.user.id);
  (pk.excludeCredentials || []).forEach(c => c.id = b64uToBuf(c.id));
  const cred = await navigator.credentials.create({ publicKey: pk });
  const r = await fetch('/auth/register/finish', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
      response: { attestationObject: bufToB64u(cred.response.attestationObject),
                  clientDataJSON: bufToB64u(cred.response.clientDataJSON) } }) });
  if (r.ok) location.reload(); else err.textContent = await r.text();
}

async function login() {
  err.textContent = '';
  const opt = await jget('/auth/login/start', { method:'POST' });
  const pk = opt.publicKey;
  pk.challenge = b64uToBuf(pk.challenge);
  (pk.allowCredentials || []).forEach(c => c.id = b64uToBuf(c.id));
  const cred = await navigator.credentials.get({ publicKey: pk });
  const r = await fetch('/auth/login/finish', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
      response: { authenticatorData: bufToB64u(cred.response.authenticatorData),
                  clientDataJSON: bufToB64u(cred.response.clientDataJSON),
                  signature: bufToB64u(cred.response.signature),
                  userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null } }) });
  if (r.ok) location.reload(); else err.textContent = await r.text();
}

(async () => {
  const st = await jget('/auth/status');
  const btn = document.getElementById('primary'), sub = document.getElementById('sub');
  if (st.registered) { sub.textContent = 'Sign in to your dashboard.'; btn.innerHTML = KEY + '<span>Sign in with passkey</span>'; btn.onclick = login; }
  else { sub.textContent = 'Set up the admin account.'; btn.innerHTML = KEY + '<span>Create account with passkey</span>'; btn.onclick = register; }
  btn.hidden = false;
})().catch(e => err.textContent = e.message);
</script>
</body>
</html>
