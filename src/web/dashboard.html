<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vitals</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a7bff'/%3E%3Cstop offset='1' stop-color='%234555d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='24' y='24' width='464' height='464' rx='116' fill='url(%23g)'/%3E%3Cpath d='M96 268 H196 L242 150 L300 386 L338 300 H392' fill='none' stroke='white' stroke-width='34' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='410' cy='300' r='24' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  /* surfaces — the instrument casing */
  --bg:#0A0C0F; --surface-1:#101318; --surface-2:#161A20; --surface-3:#1D222A;
  --line:#262C35; --line-soft:#191D23; --edge-hi:rgba(255,255,255,.03);
  /* ink ramp (WCAG-verified on --bg) */
  --ink:#ECEEF2; --ink-2:#AEB6C0; --ink-3:#7E8896; --ink-4:#58606B;
  /* accent — Pulse (signal teal); live/active/focus only, never a data series */
  --pulse:#21E0C6; --pulse-bright:#5CF0DC; --pulse-dim:#14A491;
  --pulse-ghost:rgba(33,224,198,.12); --pulse-line:rgba(33,224,198,.30);
  --accent:var(--pulse); --accent-dim:var(--pulse-ghost);
  /* state — reserved semantics */
  --ok:#33C66E; --warn:#E6A82E; --crit:#F0555A; --idle:#6B7480;
  /* data series — cool arc, disjoint from the accent */
  --series-1:#45B8FF; --series-2:#A78BFF; --series-3:#6E8BF0; --series-4:#4FC3D6;
  --grid-line:rgba(120,150,180,.05);
  /* motion — one heartbeat clock, set from health by JS */
  --pulse-period:2000ms; --beat-color:var(--ok);
  --ease-settle:cubic-bezier(.22,1,.36,1); --ease-inout:cubic-bezier(.65,0,.35,1);
  --dur-fast:120ms; --dur-base:220ms; --dur-slow:340ms;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
    var(--bg);
  background-size:32px 32px, 32px 32px, auto}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.dim{color:var(--ink-3)}
h3{font-size:13px;font-weight:600;margin:0;letter-spacing:-.01em}

/* ---------------- layout ---------------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}}

/* ---------------- sidebar ---------------- */
.sidebar{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.06em;
  padding:2px 8px 18px;text-transform:uppercase}
.logo .mk{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;flex:none;
  background:var(--surface-2);border:1px solid var(--line);color:var(--accent)}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--ink-2);
  font-size:13.5px;font-weight:500;cursor:pointer;position:relative;transition:background .12s,color .12s}
.nav .ic{width:18px;text-align:center;color:var(--ink-3);font-size:14px}
.nav:hover{color:var(--ink);background:var(--surface-1)}
.nav.active{color:var(--ink);background:var(--surface-2)}
.nav.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.nav.active .ic{color:var(--accent)}
.nav.disabled{color:var(--ink-3);cursor:default}
.nav.disabled:hover{background:none}
.nav .soon{margin-left:auto;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.sect{font-size:10px;letter-spacing:.09em;color:var(--ink-3);text-transform:uppercase;padding:16px 10px 6px;font-weight:600}
.foot{margin-top:auto;padding:14px 10px 2px;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line-soft)}
.foot a{color:var(--ink-2)}.foot a:hover{color:var(--accent)}

/* ---------------- main ---------------- */
.main{padding:20px 24px 60px;min-width:0}
.pagehead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ph-host{font-size:19px;font-weight:600;letter-spacing:-.02em}
.ph-meta{margin-left:auto}
.updated{color:var(--ink-3);font-size:12px;font-family:var(--mono)}
.updated .lv{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--beat-color);margin-right:7px;vertical-align:middle;box-shadow:0 0 6px var(--beat-color)}
.stale .updated .lv{background:var(--warn);box-shadow:none}

.cpy{cursor:pointer}
.cpy:hover{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--ink-3)}

/* ---------------- status line ---------------- */
.statusline{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:10px;margin-bottom:20px;
  background:var(--surface-1);border:1px solid var(--line);border-left:3px solid var(--idle);box-shadow:inset 0 1px 0 var(--edge-hi)}
.statusline.ok{border-left-color:var(--ok)}
.statusline.warn{border-left-color:var(--warn);background:linear-gradient(90deg,rgba(230,168,46,.05),transparent 60%)}
.statusline.crit{border-left-color:var(--crit);background:linear-gradient(90deg,rgba(240,85,90,.08),transparent 60%)}
.st-ico{font-size:15px;line-height:1;display:inline-block}
.statusline.ok .st-ico{color:var(--ok)} .statusline.warn .st-ico{color:var(--warn)} .statusline.crit .st-ico{color:var(--crit)}
.statusline.crit .st-ico{animation:lubdub var(--pulse-period) var(--ease-settle) infinite}
/* ---- the heartbeat: one clock, radial ping fired on data arrival ---- */
@keyframes beat{0%{transform:scale(1)}16%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes lubdub{0%{transform:scale(1)}8%{transform:scale(1.28)}16%{transform:scale(1)}24%{transform:scale(1.22)}40%{transform:scale(1)}100%{transform:scale(1)}}
.beat{animation:beat var(--pulse-period) var(--ease-settle)}
/* ---- the signal line: sweeps when fresh, flatlines when stale ---- */
.signalwrap{height:20px;margin:-2px 0 16px;overflow:hidden}
.signal{width:100%;height:20px;display:block}
.signal .sig-base{fill:none;stroke:var(--line);stroke-width:1.5}
.signal .sig-flat{fill:none;stroke:var(--line);stroke-width:1.5;opacity:0}
.signal .sig-pulse{fill:none;stroke:var(--pulse);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 3px var(--pulse-line));stroke-dasharray:60 1140;animation:trace 3.6s linear infinite}
@keyframes trace{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
.stale .signal .sig-base{opacity:0}
.stale .signal .sig-flat{opacity:.7}
.stale .signal .sig-pulse{animation-play-state:paused;opacity:0}
/* instrument gauge (table saturation) — track + notches + needle */
.gauge{position:relative;height:5px;width:80px;border-radius:3px;display:inline-block;vertical-align:middle;
  margin-left:8px;background:var(--surface-3)}
.gauge .notch{position:absolute;top:-1px;height:7px;width:1px;background:rgba(255,255,255,.16)}
.gauge>i{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--series-1)}
.gauge>i.warn{background:var(--warn)}.gauge>i.crit{background:var(--crit)}
.gauge .needle{position:absolute;top:-1px;height:7px;width:2px;border-radius:1px;background:currentColor;
  box-shadow:0 0 4px currentColor}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  .signal .sig-pulse{opacity:.5}
}
.st-main{min-width:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.st-msg{font-size:13.5px;font-weight:500;color:var(--ink)}
.st-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;cursor:pointer;border:1px solid var(--line)}
.chip.crit{color:var(--crit);background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.3)}
.chip.warn{color:var(--warn);background:rgba(224,160,50,.1);border-color:rgba(224,160,50,.3)}
.chip:hover{filter:brightness(1.15)}
.st-meta{margin-left:auto;color:var(--ink-3);font-size:12px;white-space:nowrap}
.st-meta b{color:var(--ink-2);font-weight:600;font-family:var(--mono)}

/* ---------------- cards / grid ---------------- */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;box-shadow:inset 0 1px 0 var(--edge-hi)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.row-2{grid-template-columns:1.7fr 1fr;margin-top:16px}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}.row-2{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:1fr}}

/* kpi card */
.kpi{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:15px 16px 10px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 var(--edge-hi)}
.kpi-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.kpi-lbl{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase}
.kpi-dot{width:7px;height:7px;border-radius:50%}
.kpi-dot.warn{background:var(--warn)} .kpi-dot.crit{background:var(--crit)}
.kpi-val{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.kpi-val .u{font-size:15px;color:var(--ink-3);margin-left:2px;font-weight:600}
.kpi-val.warn{color:var(--warn)} .kpi-val.crit{color:var(--crit)}
.kpi-val.net{font-size:19px;font-family:var(--mono);font-weight:600}
.kpi-val.net .tx{color:var(--ink-2)}
.kpi-sub{font-size:12px;color:var(--ink-3);margin-top:5px;font-family:var(--mono)}
.spark{display:block;width:100%;height:34px;margin-top:auto;padding-top:10px}
.kpi .spark{height:44px}

/* charts */
.chartcard{padding:16px 18px}
.chartcard canvas{width:100%;display:block}
.chead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:12px}
.cap{font-size:12px;color:var(--ink-3);margin-top:3px}
.cap b{color:var(--ok);font-weight:600}
.rtabs{display:flex;gap:1px;background:var(--surface-2);padding:2px;border-radius:8px;border:1px solid var(--line)}
.rtab{font:600 11px var(--font);color:var(--ink-3);background:transparent;border:0;padding:5px 9px;border-radius:6px;cursor:pointer;letter-spacing:.02em}
.rtab:hover{color:var(--ink)}
.rtab.on{background:var(--surface-3);color:var(--ink)}
.legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* recent activity */
.events-card{padding:16px 18px;display:flex;flex-direction:column;min-height:0}
.evlist{margin-top:10px;overflow:auto;max-height:246px;display:flex;flex-direction:column;gap:1px}
.ev{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:7px;cursor:pointer}
.ev:hover{background:var(--surface-2)}
.ev-i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:11px;
  background:var(--surface-2);color:var(--ink-3)}
.ev-i.ok{color:var(--ok)}.ev-i.warn{color:var(--warn)}.ev-i.crit{color:var(--crit)}
.ev-b{min-width:0;flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-b b{font-weight:600}
.ev-d{color:var(--ink-2)}
.ev-t{color:var(--ink-3);font-size:11px;font-family:var(--mono);white-space:nowrap}
.ev-empty{color:var(--ink-3);font-size:12.5px;padding:18px 6px;text-align:center}

/* table */
.tablecard{margin-top:16px}
.tablecard .pad{padding:14px 18px 6px;display:flex;align-items:baseline;gap:10px}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-3);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  font-weight:600;padding:8px 18px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:11px 18px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:var(--surface-1)}
tbody tr.crit td{background:rgba(229,72,77,.05)}
tbody tr.crit td:first-child{box-shadow:inset 2px 0 0 var(--crit)}
.cname{font-weight:600}.cimg{color:var(--ink-3);font-family:var(--mono);font-size:11px;margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.crit{color:var(--crit)}.pill.idle{color:var(--ink-3)}
.td-spk .spark{width:88px;height:22px;margin:0;padding:0}
.bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.warn{background:var(--warn)}.bar i.crit{background:var(--crit)}
.rst{font-family:var(--mono)}.rst.hot{color:var(--warn)}

/* ---------------- drawer ---------------- */
.scrim{position:fixed;inset:0;background:rgba(4,6,9,.6);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,95vw);z-index:50;display:flex;flex-direction:column;
  background:var(--surface-1);border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.45);
  transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
.drawer.open{transform:none}
.dw-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dw-head .row{display:flex;align-items:flex-start;gap:12px}
.dw-title{font-size:16px;font-weight:600}
.dw-sub{color:var(--ink-3);font-family:var(--mono);font-size:11px;margin-top:3px;word-break:break-all}
.dw-x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);border:1px solid var(--line);cursor:pointer;color:var(--ink-2)}
.dw-x:hover{color:var(--ink)}
.dw-tabs{display:flex;gap:2px;margin-top:14px}
.dw-tab{font:600 12px var(--font);color:var(--ink-3);background:transparent;border:0;padding:7px 12px;border-radius:7px;cursor:pointer}
.dw-tab:hover{color:var(--ink)}
.dw-tab.on{background:var(--surface-2);color:var(--ink)}
.dw-body{flex:1;overflow:auto;padding:16px 20px}
.dw-pane{display:none}.dw-pane.on{display:block}
.metricbox{margin-bottom:16px}
.metricbox .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.metricbox .mh .mn{font-size:11px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.metricbox .mh .mv{font-size:16px;font-weight:600;font-family:var(--mono)}
.metricbox canvas{width:100%;display:block;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.metatable{width:100%;font-size:13px;border-collapse:collapse}
.metatable td{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.metatable tr:last-child td{border-bottom:0}
.metatable td:first-child{color:var(--ink-3);width:38%}
.metatable td:last-child{text-align:right;font-family:var(--mono);font-size:12px;word-break:break-all}

/* logs */
.logbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.logbar input{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 10px;font:12px var(--mono)}
.logbar input:focus{outline:none;border-color:var(--accent)}
.logbtn{font:600 11px var(--font);padding:7px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-3);cursor:pointer;flex:none}
.logbtn:hover{color:var(--ink)}
.logbtn.on{background:var(--accent-dim);color:var(--ink);border-color:var(--accent)}
.logview{font:11.5px/1.55 var(--mono);background:#0a0c0f;border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;height:54vh;overflow:auto;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.logview .ln{display:block}
.logview .ln.err{color:var(--crit)}
.logview .ln.warn{color:var(--warn)}
.logstat{font-size:11px;color:var(--ink-3);margin-top:8px;display:flex;align-items:center;gap:7px}
.logstat .lv{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.logstat.paused .lv{background:var(--warn)}
.logstat.dead .lv{background:var(--crit)}

/* command palette */
.pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
  background:rgba(4,6,9,.55);padding-top:13vh}
.pal.open{display:flex}
.palbox{width:min(560px,92vw);background:var(--surface-1);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
.palbox input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);
  font:15px var(--font);padding:15px 18px}
.palbox input:focus{outline:none}
.pallist{max-height:52vh;overflow:auto;padding:6px}
.palitem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:13.5px}
.palitem .pd{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.palitem .k{margin-left:auto;font:10px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.palitem.sel{background:var(--surface-2)}

/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--surface-3);border:1px solid var(--line);color:var(--ink);padding:9px 15px;border-radius:9px;
  font-size:13px;z-index:70;transition:all .22s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="mk"><svg width="16" height="16" viewBox="0 0 96 96" fill="none"><path d="M8 52 H32 L42 24 L54 76 L62 56 H73" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="56" r="5.5" fill="currentColor"/></svg></span>vitals</div>
    <div class="nav active"><span class="ic">▦</span>Dashboard</div>
    <div class="nav" id="nav-containers"><span class="ic">▤</span>Containers</div>
    <div class="nav" id="nav-logs"><span class="ic">≣</span>Logs</div>
    <div class="nav disabled"><span class="ic">◈</span>Alerts<span class="soon">soon</span></div>
    <div class="sect">Account</div>
    <a class="nav" href="/logout"><span class="ic">⎋</span>Sign out</a>
    <div class="foot">Self-hosted · <a href="https://github.com/mich312/vm-vitals" target="_blank">GitHub</a></div>
  </aside>

  <main class="main">
    <div class="pagehead">
      <div class="ph-host cpy" id="host" title="click to copy">—</div>
      <div class="ph-meta"><span class="updated"><span class="lv" id="live-dot"></span><span id="upd-text">connecting…</span></span></div>
    </div>

    <div class="signalwrap"><svg class="signal" id="signal" viewBox="0 0 1200 20" preserveAspectRatio="none" aria-hidden="true">
      <polyline class="sig-flat" id="sig-flat" points="0,10 1200,10"/>
      <polyline class="sig-base" id="sig-base" points=""/>
      <polyline class="sig-pulse" id="sig-pulse" points=""/>
    </svg></div>

    <div class="statusline ok" id="statusline">
      <span class="st-ico">●</span>
      <div class="st-main"><div class="st-msg">checking…</div><div class="st-chips"></div></div>
      <div class="st-meta">uptime <b id="st-up">—</b></div>
    </div>

    <div class="grid kpis" id="kpis"></div>

    <div class="grid row-2">
      <div class="card chartcard">
        <div class="chead">
          <div><h3>Host overview</h3><div class="cap"><b id="ov-cap">live</b> · CPU &amp; memory</div></div>
          <div class="rtabs">
            <button class="rtab on" data-r="LIVE">LIVE</button>
            <button class="rtab" data-r="1H">1H</button>
            <button class="rtab" data-r="6H">6H</button>

        <canvas id="area" height="200"></canvas>
        <div class="legend"><span><i style="background:var(--series-1)"></i>CPU %</span><span><i style="background:var(--series-2)"></i>Memory %</span></div>
      </div>
      <div class="card events-card">
        <h3>Recent activity</h3>

    <div class="card tablecard">
      <div class="pad"><h3>Containers</h3><span class="cap" id="tbl-cap"></span></div>
      <div class="tbl-scroll">
      <table>
        <thead><tr><th>Container</th><th>State</th><th>Health</th><th class="r">CPU</th><th>Trend</th><th>Memory</th><th class="r">Restarts</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="dim" style="padding:20px">Loading…</td></tr></tbody>
      </table>
      </div>
    </div>
  </main>
</div>

<!-- container detail drawer -->
<div class="scrim" id="scrim"></div>

        <button class="rtab on" data-dr="1H">1H</button><button class="rtab" data-dr="6H">6H</button>
        <button class="rtab" data-dr="24H">24H</button><button class="rtab" data-dr="7D">7D</button>
      </div>
      <div class="metricbox"><div class="mh"><span class="mn">CPU %</span><span class="mv" id="dm-cpu">—</span></div><canvas id="dw-cpu" height="92"></canvas></div>

<!-- ⌘K command palette -->

  <div class="palbox">

<script>
const $=id=>document.getElementById(id), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const HEX={series1:'#45B8FF',series2:'#A78BFF',series3:'#6E8BF0',series4:'#4FC3D6',
  pulse:'#21E0C6',ok:'#33C66E',warn:'#E6A82E',crit:'#F0555A',idle:'#7E8896'};
const MONO='ui-monospace,monospace';
function rel(s){if(s<0)s=0;if(s<60)return s+'s';const m=~~(s/60);if(m<60)return m+'m';const h=~~(m/60);if(h<24)return h+'h '+(m%60)+'m';const d=~~(h/24);return d+'d '+(h%24)+'h';}
function lvl(v,w,c){return v>=c?'crit':v>=w?'warn':'ok';}
function fmtMem(mb){return mb>=1000?(mb/1000).toFixed(mb<10000?2:1)+'G':Math.round(mb)+'M';}
function fmtBps(b){if(b<1000)return Math.round(b)+' B';if(b<1e6)return (b/1e3).toFixed(b<10e3?1:0)+' kB';if(b<1e9)return (b/1e6).toFixed(b<10e6?1:0)+' MB';return (b/1e9).toFixed(1)+' GB';}

/* ring buffers */
const CAP=60, rings={};
const push=(k,v)=>{(rings[k]??=[]).push(v);if(rings[k].length>CAP)rings[k].shift();};

/* ---------- sparkline (SVG) — one micro-instrument: trace + "now" marker ---------- */
function sparkSVG(vals,color,fill=true,state){
  if(!vals||vals.length<2)return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none"></svg>`;
  const n=vals.length,mx=Math.max(...vals),mn=Math.min(...vals),rng=Math.max(1e-6,mx-mn);
  const X=i=>(i/(n-1))*97, Y=v=>38-((v-mn)/rng)*34;
  let pts='';for(let i=0;i<n;i++)pts+=X(i).toFixed(1)+','+Y(vals[i]).toFixed(1)+' ';pts=pts.trim();
  const lx=X(n-1),ly=Y(vals[n-1]);
  const hot=state==='crit'?HEX.crit:state==='warn'?HEX.warn:null;
  const area=fill?`<polygon fill="${color}" fill-opacity=".1" points="0,40 ${pts} ${lx.toFixed(1)},40"/>`:'';
  let tip='';
  if(hot){let tp='';for(let i=Math.max(0,n-3);i<n;i++)tp+=X(i).toFixed(1)+','+Y(vals[i]).toFixed(1)+' ';
    tip=`<polyline fill="none" stroke="${hot}" stroke-width="1.75" vector-effect="non-scaling-stroke" points="${tp.trim()}"/>`;}
  const nc=hot||color;
  const node=`<line x1="${lx.toFixed(1)}" y1="${(ly-3).toFixed(1)}" x2="${lx.toFixed(1)}" y2="${(ly+3).toFixed(1)}" stroke="${nc}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`;
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none">${area}<polyline fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${pts}"/>${tip}${node}</svg>`;
}

/* ---------- KPI cards ---------- */
function kpi(label,val,unit,sub,state,ring,color){
  const sc=state==='crit'?'crit':state==='warn'?'warn':'';
  return `<div class="kpi">
    <div class="kpi-top"><span class="kpi-lbl">${label}</span>${sc?`<span class="kpi-dot ${sc}"></span>`:''}</div>
    <div class="kpi-val ${sc}">${val}<span class="u">${unit}</span></div>
    <div class="kpi-sub">${sub}</div>${sparkSVG(ring,color,true,state)}</div>`;
}
function kpiNet(h,ring){
  return `<div class="kpi">
    <div class="kpi-top"><span class="kpi-lbl">Network</span></div>
    <div class="kpi-val net">↓${fmtBps(h.net_rx_bps||0)} <span class="tx">↑${fmtBps(h.net_tx_bps||0)}</span></div>
    <div class="kpi-sub">rx / tx per second</div>${sparkSVG(ring,HEX.series4)}</div>`;
}

/* ---------- area chart (host cpu+mem, LIVE or fetched range) ---------- */
const chart={mode:'LIVE',cpu:[],mem:[],t:null};
function drawArea(){
  const cv=$('area'),w=cv.clientWidth||700,h=200,dpr=Math.min(devicePixelRatio||1,2);
  if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr;}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const pad={l:30,r:20,t:14,b:22};
  g.lineCap='round';g.lineJoin='round';
  // graph-paper grid: solid baseline, dashed 25/50/75, labels 0/50/100
  g.fillStyle=HEX.idle;g.font='10px '+MONO;g.textAlign='right';g.textBaseline='middle';
  for(let i=0;i<=4;i++){const val=100-i*25,y=pad.t+(h-pad.t-pad.b)*i/4;
    g.setLineDash(i===4?[]:[1,3]);g.strokeStyle=i===4?'rgba(255,255,255,.10)':'rgba(255,255,255,.05)';
    g.beginPath();g.moveTo(pad.l,y);g.lineTo(w-pad.r,y);g.stroke();
    if(val%50===0)g.fillText(val,pad.l-6,y);}
  g.setLineDash([]);
  const series=[[chart.cpu,HEX.series1],[chart.mem,HEX.series2]];
  const dim=v=>({n:v.length,x:i=>pad.l+(i/(v.length-1))*(w-pad.l-pad.r),y:val=>pad.t+(1-clamp(val,0,100)/100)*(h-pad.t-pad.b)});
  const live=chart.mode==='LIVE';
  // the "now" line (live only)
  if(live&&((chart.cpu&&chart.cpu.length>1)||(chart.mem&&chart.mem.length>1))){
    g.strokeStyle='rgba(255,255,255,.09)';g.beginPath();g.moveTo(w-pad.r,pad.t);g.lineTo(w-pad.r,h-pad.b);g.stroke();}
  // area fills
  for(const [v,c] of series){if(!v||v.length<2)continue;const {n,x,y}=dim(v);
    g.beginPath();g.moveTo(x(0),h-pad.b);for(let i=0;i<n;i++)g.lineTo(x(i),y(v[i]));g.lineTo(x(n-1),h-pad.b);g.closePath();
    const gr=g.createLinearGradient(0,pad.t,0,h-pad.b);gr.addColorStop(0,c+'2e');gr.addColorStop(1,c+'00');g.fillStyle=gr;g.fill();}
  // traces with horizontal tail-fade (signal flows in from the left)
  for(let s=0;s<series.length;s++){const [v,c]=series[s];if(!v||v.length<2)continue;const {n,x,y}=dim(v);
    const gx=g.createLinearGradient(pad.l,0,w-pad.r,0);gx.addColorStop(0,c+'00');gx.addColorStop(.14,c);gx.addColorStop(1,c);
    g.strokeStyle=gx;g.lineWidth=s===0?2:1.75;
    g.beginPath();g.moveTo(x(0),y(v[0]));for(let i=1;i<n;i++)g.lineTo(x(i),y(v[i]));g.stroke();}
  // terminal pulse beads on the now-line (LIVE only — the signature node)
  if(live)for(const [v,c] of series){if(!v||v.length<2)continue;const {n,x,y}=dim(v);const px=x(n-1),py=y(v[n-1]);
    const hg=g.createRadialGradient(px,py,0,px,py,11);hg.addColorStop(0,c+'66');hg.addColorStop(1,c+'00');
    g.fillStyle=hg;g.beginPath();g.arc(px,py,11,0,7);g.fill();
    g.strokeStyle=c+'cc';g.lineWidth=1.5;g.beginPath();g.arc(px,py,4.5,0,7);g.stroke();
    g.fillStyle=c;g.beginPath();g.arc(px,py,3,0,7);g.fill();}
  if(chart.t&&chart.t.length>1){g.fillStyle=HEX.idle;g.textAlign='center';const n=chart.t.length;
    for(let k=0;k<=4;k++){const i=Math.round((n-1)*k/4),xx=pad.l+(i/(n-1))*(w-pad.l-pad.r),dt=new Date(chart.t[i]*1000);
      const lbl=chart.mode==='7D'?(dt.getMonth()+1)+'/'+dt.getDate():String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
      g.fillText(lbl,xx,h-6);}}
}
async function setRange(mode){
  chart.mode=mode;
  document.querySelectorAll('.rtabs [data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===mode));
  $('ov-cap').textContent=mode==='LIVE'?'live':mode;
  if(mode==='LIVE'){chart.t=null;return;}
  const spans={'1H':3600,'6H':21600,'24H':86400,'7D':604800},to=Math.floor(Date.now()/1000),from=to-spans[mode];
  try{const [cpu,mem]=await Promise.all([
    fetch(`/api/series?metric=host.cpu&from=${from}&to=${to}`).then(r=>r.json()),
    fetch(`/api/series?metric=host.mem&from=${from}&to=${to}`).then(r=>r.json())]);
    chart.cpu=cpu.avg;chart.mem=mem.avg;chart.t=cpu.t;drawArea();
  }catch(e){}
}
document.querySelectorAll('.rtabs [data-r]').forEach(b=>b.onclick=()=>setRange(b.dataset.r));
setInterval(()=>{if(chart.mode!=='LIVE')setRange(chart.mode);},60000);

/* ---------- container severity ---------- */
function sev(c){const h=(c.health||'').toLowerCase();
  if(c.state==='restarting'||c.state==='dead'||h==='unhealthy')return 'crit';
  if(c.state==='exited'||h==='starting')return 'warn';
  if(c.state!=='running')return 'idle';return 'ok';}
const RANK={crit:0,warn:1,idle:2,ok:3};

/* ---------- recent activity ---------- */
let lastRestart={};
async function loadEvents(){
  try{const evs=await fetch('/api/events').then(r=>r.json());
    lastRestart={};for(const e of evs){if(e.kind==='restart'&&!(e.container in lastRestart))lastRestart[e.container]=e.ts;}
    renderEvents(evs);
  }catch(_){}
}
function renderEvents(evs){
  const el=$('events');
  if(!evs||!evs.length){el.innerHTML='<div class="ev-empty">No events yet — quiet is good.</div>';return;}
  const now=Math.floor(Date.now()/1000);
  el.innerHTML=evs.slice(0,14).map(e=>{
    const cls=e.kind==='restart'?'warn':e.kind==='down'?'crit':e.kind==='up'?'ok':e.kind==='health'?(/unhealthy/.test(e.detail)?'crit':'ok'):'idle';
    const ico=e.kind==='restart'?'↻':e.kind==='down'?'▲':e.kind==='up'?'●':e.kind==='health'?'✚':'◆';
    return `<div class="ev clk" data-c="${e.container}"><span class="ev-i ${cls}">${ico}</span>
      <div class="ev-b"><b>${e.container}</b> <span class="ev-d">${e.detail}</span></div>
      <span class="ev-t">${rel(now-e.ts)}</span></div>`;}).join('');
}

/* ---------- render ---------- */
let last=null;
function render(d){
  last=d;const h=d.host,cs=d.containers;
  $('host').textContent=h.hostname;
  // rings
  push('host.cpu',h.cpu_pct);push('host.mem',h.mem_used_pct);push('host.disk',h.disk_used_pct);push('host.net',h.net_rx_bps||0);
  for(const c of cs){if(c.cpu_pct!=null)push('c.'+c.name+'.cpu',c.cpu_pct);}
  // kpis
  const cpuL=lvl(h.cpu_pct,75,90),memL=lvl(h.mem_used_pct,80,92),diskL=lvl(h.disk_used_pct,80,90);
  $('kpis').innerHTML=
    kpi('CPU',h.cpu_pct.toFixed(1),'%',`load ${h.load1.toFixed(2)} · ${h.load5.toFixed(2)} · ${h.load15.toFixed(2)}`,cpuL,rings['host.cpu'],HEX.series1)+
    kpi('Memory',h.mem_used_pct.toFixed(0),'%',`${fmtMem(h.mem_total_mb-h.mem_avail_mb)} of ${fmtMem(h.mem_total_mb)}`,memL,rings['host.mem'],HEX.series2)+
    kpi('Disk',h.disk_used_pct.toFixed(0),'%',`${h.disk_avail_gb.toFixed(0)}G free of ${h.disk_total_gb.toFixed(0)}G`,diskL,rings['host.disk'],HEX.series3)+
    kpiNet(h,rings['host.net']);
  // trend live
  if(chart.mode==='LIVE'){chart.cpu=rings['host.cpu'];chart.mem=rings['host.mem'];chart.t=null;drawArea();}
  // verdict
  let crit=0,warn=0;for(const v of [cpuL,memL,diskL]){if(v==='crit')crit++;else if(v==='warn')warn++;}
  for(const c of cs){const s=sev(c);if(s==='crit')crit++;else if(s==='warn')warn++;}
  const worst=crit?'crit':warn?'warn':'ok';
  setBeatState(worst);
  // status line
  const sl=$('statusline');sl.className='statusline '+worst;
  sl.querySelector('.st-ico').textContent=worst==='crit'?'▲':worst==='warn'?'◆':'●';
  const running=cs.filter(c=>c.state==='running').length;
  const bad=cs.filter(c=>sev(c)==='crit'||sev(c)==='warn').sort((a,b)=>RANK[sev(a)]-RANK[sev(b)]);
  const hostBad=[];if(cpuL!=='ok')hostBad.push(`CPU ${h.cpu_pct.toFixed(0)}%`);if(memL!=='ok')hostBad.push(`memory ${h.mem_used_pct.toFixed(0)}%`);if(diskL!=='ok')hostBad.push(`disk ${h.disk_used_pct.toFixed(0)}%`);
  if(worst==='ok'){sl.querySelector('.st-msg').textContent=`All ${running}/${cs.length} containers up · nothing above threshold`;sl.querySelector('.st-chips').innerHTML='';}
  else{sl.querySelector('.st-msg').textContent=[crit?crit+' critical':'',warn?warn+' degraded':''].filter(Boolean).join(' · ')+(hostBad.length?' · host '+hostBad.join(', '):'');
    sl.querySelector('.st-chips').innerHTML=bad.slice(0,6).map(c=>`<span class="chip ${sev(c)}" data-c="${c.name}">${c.name}</span>`).join('');}
  $('st-up').textContent=rel(h.uptime_secs);
  // table
  $('tbl-cap').textContent=`${running} running · ${(cs.reduce((s,c)=>s+(c.mem_mb||0),0)/1000).toFixed(1)} GB total`;
  cs.sort((a,b)=>(RANK[sev(a)]-RANK[sev(b)])||a.name.localeCompare(b.name));
  const nowS=Math.floor(Date.now()/1000);
  $('rows').innerHTML=cs.map(c=>{const s=sev(c),p=s==='idle'?'idle':s;
    const mem=c.mem_mb!=null?fmtMem(c.mem_mb):'—';
    const memPct=c.mem_mb!=null&&c.mem_limit_mb?clamp(c.mem_mb/c.mem_limit_mb*100,0,100):null;
    const mc=memPct!=null?lvl(memPct,75,90):'';
    const gcol=mc==='crit'?'var(--crit)':mc==='warn'?'var(--warn)':'var(--series-1)';
    const gauge=memPct!=null?`<span class="gauge" style="color:${gcol}"><i class="${mc}" style="width:${memPct}%"></i><span class="notch" style="left:75%"></span><span class="notch" style="left:90%"></span><span class="needle" style="left:calc(${memPct.toFixed(0)}% - 1px)"></span></span>`:'';
    const cpu=c.cpu_pct!=null?c.cpu_pct.toFixed(1)+'%':'<span class="dim">—</span>';
    const spk=c.cpu_pct!=null?`<span class="td-spk">${sparkSVG(rings['c.'+c.name+'.cpu'],HEX.series1,false)}</span>`:'';
    let rst='<span class="rst dim">0</span>';
    if(c.restarts>0){const t=lastRestart[c.name];rst=`<span class="rst hot">↻ ${c.restarts}</span>`+(t?` <span class="dim">· ${rel(nowS-t)}</span>`:'');}
    return `<tr class="clk ${s==='crit'?'crit':''}" data-c="${c.name}">
      <td><div class="cname">${c.name}</div><div class="cimg">${c.image}</div></td>
      <td><span class="pill ${p}"><span class="dot"></span>${c.state}</span></td>
      <td>${c.health?`<span class="pill ${c.health==='healthy'?'ok':c.health==='unhealthy'?'crit':'warn'}">${c.health}</span>`:'<span class="dim">—</span>'}</td>
      <td class="r">${cpu}</td>
      <td>${spk}</td>
      <td>${mem}${gauge}</td>
      <td class="r">${rst}</td></tr>`;}).join('');
  if(dw.name)renderDrawer();
  document.title=(worst==='crit'?'▲ ':worst==='warn'?'◆ ':'')+'vitals · '+h.hostname;
}

/* ---------- container drawer ---------- */
const DR_SPANS={'1H':3600,'6H':21600,'24H':86400,'7D':604800};
const dw={name:null,range:'1H',es:null,follow:true,wrap:true,lines:[],filter:''};
const curC=()=>((last&&last.containers)||[]).find(c=>c.name===dw.name);
function miniChart(cv,vals,color){
  const w=cv.clientWidth||480,h=92,dpr=Math.min(devicePixelRatio||1,2);
  if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr;}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const pad={l:6,r:6,t:10,b:8};
  if(!vals||vals.length<2){g.fillStyle=HEX.idle;g.font='11px sans-serif';g.textAlign='center';g.fillText('collecting history…',w/2,h/2);return;}
  const n=vals.length,mx=Math.max(...vals),mn=Math.min(...vals),rng=Math.max(1e-6,mx-mn);
  const x=i=>pad.l+(i/(n-1))*(w-pad.l-pad.r),y=v=>pad.t+(1-(v-mn)/rng)*(h-pad.t-pad.b);
  g.beginPath();g.moveTo(x(0),h-pad.b);for(let i=0;i<n;i++)g.lineTo(x(i),y(vals[i]));g.lineTo(x(n-1),h-pad.b);g.closePath();
  const gr=g.createLinearGradient(0,pad.t,0,h-pad.b);gr.addColorStop(0,color+'26');gr.addColorStop(1,color+'00');g.fillStyle=gr;g.fill();
  g.beginPath();g.moveTo(x(0),y(vals[0]));for(let i=1;i<n;i++)g.lineTo(x(i),y(vals[i]));g.strokeStyle=color;g.lineWidth=1.75;g.stroke();
}
function renderDrawer(){
  const c=curC();if(!c)return;
  $('dw-name').textContent=c.name;$('dw-img').textContent=c.image;
  $('dm-cpu').textContent=c.cpu_pct!=null?c.cpu_pct.toFixed(1)+'%':'—';
  $('dm-mem').textContent=c.mem_mb!=null?fmtMem(c.mem_mb):'—';
  $('dw-meta').innerHTML=[
    ['State',c.state],['Health',c.health||'—'],['Restarts',c.restarts],
    ['CPU',c.cpu_pct!=null?c.cpu_pct.toFixed(1)+'%':'—'],
    ['Memory',c.mem_mb!=null?fmtMem(c.mem_mb):'—'],
    ['Mem limit',c.mem_limit_mb?fmtMem(c.mem_limit_mb):'—'],
    ['Status',c.status],['Image',c.image]
  ].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}
async function loadDrawerCharts(){
  const name=dw.name;if(!name)return;
  const to=Math.floor(Date.now()/1000),from=to-DR_SPANS[dw.range];
  const q=m=>`/api/series?metric=c.${encodeURIComponent(name)}.${m}&from=${from}&to=${to}`;
  try{const [cpu,mem]=await Promise.all([fetch(q('cpu')).then(r=>r.json()),fetch(q('mem')).then(r=>r.json())]);
    if(dw.name!==name)return;miniChart($('dw-cpu'),cpu.avg,HEX.series1);miniChart($('dw-mem'),mem.avg,HEX.series2);
  }catch(e){}
}
function showPane(p){
  document.querySelectorAll('.dw-tab').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.dw-pane').forEach(el=>el.classList.toggle('on',el.id==='pane-'+p));
  if(p==='logs')startLogs();else stopLogs();
  if(p==='over')loadDrawerCharts();
}
function openDrawer(name){
  dw.name=name;
  if(location.hash!=='#c/'+encodeURIComponent(name))history.replaceState(null,'','#c/'+encodeURIComponent(name));
  $('scrim').classList.add('open');$('drawer').classList.add('open');$('drawer').setAttribute('aria-hidden','false');
  renderDrawer();showPane('over');
  $('dw-ranges').querySelectorAll('.rtab').forEach(x=>x.classList.toggle('on',x.dataset.dr===dw.range));
}
function closeDrawer(){
  stopLogs();dw.name=null;
  $('scrim').classList.remove('open');$('drawer').classList.remove('open');$('drawer').setAttribute('aria-hidden','true');
  if(location.hash.startsWith('#c/'))history.replaceState(null,'','#');
}
document.querySelectorAll('.dw-tab').forEach(b=>b.onclick=()=>showPane(b.dataset.p));
$('dw-x').onclick=closeDrawer;$('scrim').onclick=closeDrawer;
$('dw-ranges').querySelectorAll('.rtab').forEach(b=>b.onclick=()=>{
  dw.range=b.dataset.dr;$('dw-ranges').querySelectorAll('.rtab').forEach(x=>x.classList.toggle('on',x===b));loadDrawerCharts();});
$('rows').addEventListener('click',e=>{const tr=e.target.closest('tr[data-c]');if(tr)openDrawer(tr.dataset.c);});
$('statusline').addEventListener('click',e=>{const ch=e.target.closest('.chip[data-c]');if(ch)openDrawer(ch.dataset.c);});
$('events').addEventListener('click',e=>{const ev=e.target.closest('.ev[data-c]');if(ev)openDrawer(ev.dataset.c);});

/* ---------- live logs (SSE) ---------- */
const LOGCAP=800;
function setLogStat(t,cls){$('logstat-t').textContent=t;const s=$('logstat');s.classList.remove('paused','dead');if(cls)s.classList.add(cls);}
function logLevel(s,m){return /\b(error|err|fatal|panic|fail)\b/i.test(m)?'err':/\b(warn|warning)\b/i.test(m)?'warn':(s==='err'?'err':'');}
/* ANSI SGR → HTML (colors, bold/dim/italic/underline). Any escape sequence is
   consumed so nothing renders as a stray glyph; text is HTML-escaped. */
const ANSI_RE=/\x1b\[[0-9;?]*[ -\/]*[@-~]/g;
const ANSI_FG={30:'#5a626d',31:'#e5484d',32:'#3fb265',33:'#e0a032',34:'#6a7bff',35:'#c678dd',36:'#5bd1e6',37:'#a8b0ba',
  90:'#7d8794',91:'#f06a6f',92:'#5ecb83',93:'#f0c05a',94:'#8b9bff',95:'#d68bf0',96:'#7fe0f0',97:'#e8eaed'};
function xterm256(n){n=+n||0;
  const b=['#000','#cd0000','#00cd00','#cdcd00','#0000ee','#cd00cd','#00cdcd','#e5e5e5','#7f7f7f','#ff5555','#55ff55','#ffff55','#5c5cff','#ff55ff','#55ffff','#fff'];
  if(n<16)return b[n];
  if(n<232){n-=16;const r=Math.floor(n/36),g=Math.floor((n%36)/6),c=n%6,cv=v=>v?55+v*40:0;return `rgb(${cv(r)},${cv(g)},${cv(c)})`;}
  const v=8+(n-232)*10;return `rgb(${v},${v},${v})`;}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function ansiToHtml(str){
  let res='',last=0,m;const cur={fg:null,bold:false,dim:false,it:false,ul:false};
  const flush=t=>{if(!t)return;t=esc(t.replace(/\x1b/g,''));
    if(cur.fg||cur.bold||cur.dim||cur.it||cur.ul){let st='';
      if(cur.fg)st+='color:'+cur.fg+';';if(cur.bold)st+='font-weight:600;';if(cur.dim)st+='opacity:.6;';
      if(cur.it)st+='font-style:italic;';if(cur.ul)st+='text-decoration:underline;';
      res+='<span style="'+st+'">'+t+'</span>';}else res+=t;};
  ANSI_RE.lastIndex=0;
  while((m=ANSI_RE.exec(str))){
    flush(str.slice(last,m.index));last=ANSI_RE.lastIndex;
    if(!m[0].endsWith('m'))continue; // only SGR carries styling
    const codes=(m[0].slice(2,-1)||'0').split(';').map(Number);
    for(let k=0;k<codes.length;k++){const c=codes[k];
      if(c===0)Object.assign(cur,{fg:null,bold:false,dim:false,it:false,ul:false});
      else if(c===1)cur.bold=true;else if(c===2)cur.dim=true;else if(c===3)cur.it=true;else if(c===4)cur.ul=true;
      else if(c===22){cur.bold=false;cur.dim=false;}else if(c===23)cur.it=false;else if(c===24)cur.ul=false;
      else if(c===39)cur.fg=null;
      else if((c>=30&&c<=37)||(c>=90&&c<=97))cur.fg=ANSI_FG[c];
      else if(c===38){if(codes[k+1]===5){cur.fg=xterm256(codes[k+2]);k+=2;}else if(codes[k+1]===2){cur.fg=`rgb(${codes[k+2]||0},${codes[k+3]||0},${codes[k+4]||0})`;k+=4;}}
    }
  }
  flush(str.slice(last));
  return res;
}
function appendLine(s,m){
  const plain=m.replace(ANSI_RE,'');
  const f=dw.filter;if(f&&!plain.toLowerCase().includes(f))return;
  const box=$('logview'),el=document.createElement('span');
  if(m.indexOf('\x1b')>=0){el.className='ln';el.innerHTML=ansiToHtml(m);}
  else{el.className='ln '+logLevel(s,plain);el.textContent=m;}
  box.appendChild(el);
  while(box.children.length>LOGCAP)box.removeChild(box.firstChild);
  if(dw.follow)box.scrollTop=box.scrollHeight;
}
function reflowLogs(){const box=$('logview');box.innerHTML='';for(const l of dw.lines)appendLine(l.s,l.m);}
function startLogs(){
  if(dw.es||!dw.name)return;
  dw.lines=[];$('logview').innerHTML='';setLogStat('connecting…','paused');
  const es=new EventSource('/api/logs/'+encodeURIComponent(dw.name));dw.es=es;
  es.onopen=()=>setLogStat('streaming live');
  es.onmessage=e=>{try{const o=JSON.parse(e.data);dw.lines.push(o);if(dw.lines.length>LOGCAP)dw.lines.shift();appendLine(o.s,o.m);}catch(_){}};
  es.addEventListener('fatal',e=>{appendLine('err','— '+e.data+' —');setLogStat('stopped','dead');stopLogs();});
  es.onerror=()=>setLogStat('reconnecting…','paused');
}
function stopLogs(){if(dw.es){dw.es.close();dw.es=null;}}
$('log-filter').oninput=e=>{dw.filter=e.target.value.toLowerCase();reflowLogs();};
$('log-follow').onclick=()=>{dw.follow=!dw.follow;$('log-follow').classList.toggle('on',dw.follow);if(dw.follow){const b=$('logview');b.scrollTop=b.scrollHeight;}};
$('log-wrap').onclick=()=>{dw.wrap=!dw.wrap;$('logview').style.whiteSpace=dw.wrap?'pre-wrap':'pre';$('log-wrap').classList.toggle('on',dw.wrap);};
$('log-clear').onclick=()=>{dw.lines=[];$('logview').innerHTML='';};
$('logview').addEventListener('scroll',()=>{const b=$('logview');
  if(dw.follow&&b.scrollHeight-b.scrollTop-b.clientHeight>40){dw.follow=false;$('log-follow').classList.remove('on');}});
setInterval(()=>{if(dw.name&&$('pane-over').classList.contains('on'))loadDrawerCharts();},30000);

/* ---------- ⌘K command palette ---------- */
const pal={open:false,sel:0,items:[]};
function buildPal(q){
  q=(q||'').toLowerCase().trim();
  const cs=((last&&last.containers)||[]).map(c=>({t:c.name,d:c.state,color:sev(c),act:()=>{closePal();openDrawer(c.name);}}));
  const cmds=[
    {t:'View host overview',d:'nav',color:'ok',act:()=>{closePal();scrollTo(0,0);}},
    {t:'Sign out',d:'account',color:'idle',act:()=>location.href='/logout'}
  ];
  pal.items=[...cs,...cmds].filter(i=>!q||i.t.toLowerCase().includes(q)||i.d.includes(q));pal.sel=0;
  const cmap={crit:HEX.crit,warn:HEX.warn,ok:HEX.ok,idle:HEX.idle};
  $('pal-list').innerHTML=pal.items.length?pal.items.map((i,ix)=>
    `<div class="palitem${ix===0?' sel':''}" data-i="${ix}"><span class="pd" style="color:${cmap[i.color]||HEX.idle}"></span>${i.t}<span class="k">${i.d}</span></div>`).join('')
    :'<div class="palitem dim">no matches</div>';
}
function openPal(){pal.open=true;$('pal').classList.add('open');$('pal-in').value='';buildPal('');$('pal-in').focus();}
function closePal(){pal.open=false;$('pal').classList.remove('open');}
function palMove(d){if(!pal.items.length)return;pal.sel=(pal.sel+d+pal.items.length)%pal.items.length;
  const els=$('pal-list').querySelectorAll('.palitem');els.forEach((el,ix)=>el.classList.toggle('sel',ix===pal.sel));els[pal.sel]?.scrollIntoView({block:'nearest'});}
$('pal-in').oninput=e=>buildPal(e.target.value);
$('pal-list').addEventListener('click',e=>{const it=e.target.closest('[data-i]');if(it)pal.items[+it.dataset.i]?.act();});
$('pal').addEventListener('click',e=>{if(e.target===$('pal'))closePal();});

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.open?closePal():openPal();return;}
  if(e.key==='Escape'){if(pal.open)closePal();else if(dw.name)closeDrawer();return;}
  if(pal.open){
    if(e.key==='ArrowDown'){e.preventDefault();palMove(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();palMove(-1);}
    else if(e.key==='Enter'){e.preventDefault();pal.items[pal.sel]?.act();}
  }
});

/* ---------- click-to-copy + nav + deep link ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1400);}
function copy(txt){if(!txt)return;(navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast('Copied: '+txt)).catch(()=>toast('Copy failed'));}
$('host').onclick=()=>copy($('host').textContent);
$('dw-img').onclick=()=>copy($('dw-img').textContent);
$('nav-containers').onclick=()=>scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
$('nav-logs').onclick=openPal;
let deepDone=false;
function applyDeepLink(){const m=location.hash.match(/^#c\/(.+)$/);if(m)openDrawer(decodeURIComponent(m[1]));}
addEventListener('hashchange',()=>{const m=location.hash.match(/^#c\/(.+)$/);
  if(m&&decodeURIComponent(m[1])!==dw.name)openDrawer(decodeURIComponent(m[1]));else if(!m&&dw.name)closeDrawer();});

/* ---------- the heartbeat + signal line ---------- */
let worstState='ok';
function setBeatState(worst){
  worstState=worst;
  const P=worst==='crit'?820:worst==='warn'?1400:2000;
  const C=worst==='crit'?'var(--crit)':worst==='warn'?'var(--warn)':'var(--ok)';
  document.body.style.setProperty('--pulse-period',P+'ms');
  document.body.style.setProperty('--beat-color',C);
}
function beat(){
  const d=$('live-dot');if(d){d.classList.remove('beat');void d.offsetWidth;d.classList.add('beat');}
  const ic=document.querySelector('.st-ico');
  if(ic&&worstState!=='crit'){ic.classList.remove('beat');void ic.offsetWidth;ic.classList.add('beat');}
}
(function buildSignal(){
  const W=1200,mid=10,beat=160,p=[[0,mid]];
  for(let x=0;x<W;x+=beat){const b=x+beat*0.5;
    p.push([b-11,mid],[b-6,mid-6],[b-2,mid+7],[b+2,mid-2],[b+6,mid],[x+beat,mid]);}
  p.push([W,mid]);
  const s=p.map(q=>q[0].toFixed(0)+','+q[1]).join(' ');
  $('sig-base').setAttribute('points',s);$('sig-pulse').setAttribute('points',s);
})();

/* ---------- live loop ---------- */
const CAD=2000,STALE=6000;let lastOk=0,backoff=CAD;
async function poll(){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),CAD);
  try{const r=await fetch('/api/status',{signal:ac.signal});if(r.status===401){location.href='/';return;}
    const d=await r.json();if(d){render(d);beat();}lastOk=Date.now();backoff=CAD;document.body.classList.remove('stale');
    if(d&&!deepDone){deepDone=true;applyDeepLink();}}
  catch(e){backoff=Math.min(backoff*1.6,20000);if(Date.now()-lastOk>STALE)document.body.classList.add('stale');}
  finally{clearTimeout(t);setTimeout(poll,backoff);}}
setInterval(()=>{const u=$('upd-text');if(!u)return;if(!lastOk){u.textContent='connecting…';return;}
  const s=~~((Date.now()-lastOk)/1000),st=document.body.classList.contains('stale');
  u.textContent=st?('signal lost · '+rel(s)):('updated '+rel(s)+' ago');},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
addEventListener('resize',()=>{drawArea();if(dw.name&&$('pane-over').classList.contains('on'))loadDrawerCharts();});
loadEvents();setInterval(loadEvents,5000);
poll();
</script>
