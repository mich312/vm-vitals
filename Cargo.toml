[package]
name = "vitals"
version = "0.0.0"
edition = "2021"
# Driven by webauthn-rs 0.5 (and the edition2024 crates in its tree).
# Verified: 1.86 and below cannot build this, 1.88 builds and tests clean.
rust-version = "1.88"
description = "Know how your servers are doing — a small self-hosted host + Docker watchdog."
license = "MIT"
repository = "https://github.com/mich312/vm-vitals"
readme = "README.md"
keywords = ["monitoring", "docker", "alerting", "metrics", "self-hosted"]
categories = ["command-line-utilities"]

[[bin]]
name = "vitals"
path = "src/main.rs"

# M0 dependencies only — collectors + a JSON status endpoint. Later milestones
# add: reqwest + tokio-rustls + x509-parser (endpoint/tls checks, M1/M2),
# rusqlite (history store, M2), webauthn-rs + rust-embed (dashboard/auth, M3).
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
humantime-serde = "1"          # parse "15s"/"6h" durations in config
sysinfo = "0.32"               # host cpu/mem/disk/load
bollard = "0.17"               # Docker API over the socket
futures-util = "0.3"           # concurrent per-container stats streams
rusqlite = { version = "0.32", features = ["bundled"] }  # embedded time-series store
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Passkey (WebAuthn) sign-in for the dashboard.
webauthn-rs = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
axum-extra = { version = "0.9", features = ["cookie"] }
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Software authenticator, so the passkey ceremonies can be driven end-to-end in
# tests.
[dev-dependencies]
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
