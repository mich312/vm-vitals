[package]
name = "vitals"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
description = "Know how your servers are doing — a small self-hosted host + Docker watchdog."
license = "MIT"
repository = "https://github.com/mich312/vitals"
readme = "README.md"
keywords = ["monitoring", "docker", "alerting", "metrics", "self-hosted"]
categories = ["command-line-utilities"]

[[bin]]
name = "vitals"
path = "src/main.rs"

# Versions are indicative — run `cargo add` / `cargo update` when wiring each
# module up. Deps map to the SPEC: collectors, store, web, auth, notify.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["compression-gzip", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sysinfo = "0.32"                 # host cpu/mem/disk/load
bollard = "0.17"                 # Docker API over the socket (stats, state, logs)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-rustls = "0.26"            # TLS handshake for cert-expiry checks
x509-parser = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }   # embedded time-series store
webauthn-rs = "0.5"             # passkey (WebAuthn) dashboard auth
rust-embed = "8"               # bundle the dashboard assets into the binary
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
humantime-serde = "1"          # parse "15s"/"6h" durations in config

[profile.release]
opt-level = "z"                 # small binary — this is a lightweight tool
lto = true
codegen-units = 1
strip = true
panic = "abort"
